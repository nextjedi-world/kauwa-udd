# Git hooks (https://lefthook.dev). Installed by `make setup`.
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,mjs,cjs,ts,tsx,mts,json,css,md,yml,yaml}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    eslint:
      glob: '*.{js,mjs,cjs,ts,tsx,mts}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: >-
        head -n 1 {1} | grep -Eq
        '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
        || (echo 'Commit message must be a conventional commit, for example: feat: add paywall' && exit 1)

pre-push:
  commands:
    verify:
      run: make verify
